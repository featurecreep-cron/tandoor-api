name: Dependabot Auto-merge

# tandoor-api has no required reviews and no PR-triggered CI, so a dependabot
# PR just needs to be merged. No approval App (and no BOT_APP_ID/BOT_PRIVATE_KEY
# secrets) is required — merge directly with the default token.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && startsWith(github.event.pull_request.head.ref, 'dependabot/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge the dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
